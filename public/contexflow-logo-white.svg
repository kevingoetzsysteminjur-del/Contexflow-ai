<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Abstract flow/network symbol -->
  <g transform="translate(10, 10)">
    <circle cx="40" cy="40" r="36" fill="none" stroke="url(#iconGrad)" stroke-width="3"/>
    <path d="M 20 28 Q 32 20, 40 32 Q 48 44, 60 36" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 20 44 Q 32 36, 40 48 Q 48 60, 60 52" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="20" cy="28" r="3.5" fill="#6366F1"/>
    <circle cx="40" cy="32" r="3.5" fill="#6366F1"/>
    <circle cx="60" cy="36" r="3.5" fill="#6366F1"/>
    <circle cx="20" cy="44" r="3.5" fill="#8B5CF6"/>
    <circle cx="40" cy="48" r="3.5" fill="#8B5CF6"/>
    <circle cx="60" cy="52" r="3.5" fill="#8B5CF6"/>
    <circle cx="40" cy="40" r="5" fill="url(#iconGrad)"/>
    <circle cx="40" cy="40" r="2" fill="white"/>
  </g>

  <!-- Text: CONTEXFLOW (white for dark backgrounds) -->
  <text x="105" y="48" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="28" font-weight="300" letter-spacing="0.12em" fill="#F5F5F7">CONTEXFLOW</text>
  <text x="105" y="72" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="0.3em" fill="#8B5CF6">AI</text>
</svg>