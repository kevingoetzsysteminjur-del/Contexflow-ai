<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon only - for favicon, profile pictures, app icons -->
  <circle cx="40" cy="40" r="36" fill="none" stroke="url(#iconGrad)" stroke-width="3"/>

  <!-- Flow lines -->
  <path d="M 20 28 Q 32 20, 40 32 Q 48 44, 60 36" fill="none" stroke="#6366F1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 20 44 Q 32 36, 40 48 Q 48 60, 60 52" fill="none" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="20" cy="28" r="3.5" fill="#6366F1"/>
  <circle cx="40" cy="32" r="3.5" fill="#6366F1"/>
  <circle cx="60" cy="36" r="3.5" fill="#6366F1"/>
  <circle cx="20" cy="44" r="3.5" fill="#8B5CF6"/>
  <circle cx="40" cy="48" r="3.5" fill="#8B5CF6"/>
  <circle cx="60" cy="52" r="3.5" fill="#8B5CF6"/>

  <!-- Center -->
  <circle cx="40" cy="40" r="5" fill="url(#iconGrad)"/>
  <circle cx="40" cy="40" r="2" fill="white"/>
</svg>